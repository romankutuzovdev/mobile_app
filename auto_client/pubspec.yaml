name: auto_client
description: Мобильный клиент для авто-ассистента (VIN, мануалы, GPT)
publish_to: "none"

version: 0.1.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  dotted_border: ^2.1.0
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  shared_preferences: ^2.2.3
  local_auth: ^2.2.0
  flutter_secure_storage: ^9.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/onboarding_chat_mockup.png
    - assets/onboarding_iphone_mockup.png
    - assets/onboarding_iphone_mockup_2.png
